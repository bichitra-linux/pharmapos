services:
    mysql:
        image: mysql:8.0
        container_name: pharmapos-mysql
        restart: unless-stopped
        ports:
            - '${DB_PORT:-3306}:3306'
        environment:
            MYSQL_ROOT_PASSWORD: '${DB_PASSWORD}'
            MYSQL_DATABASE: '${DB_DATABASE}'
            MYSQL_USER: '${DB_USERNAME}'
            MYSQL_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ALLOW_EMPTY_PASSWORD: 'no'
        volumes:
            - mysql-data:/var/lib/mysql
        healthcheck:
            test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
            interval: 10s
            timeout: 5s
            retries: 5
        networks:
            - pharmapos

    redis:
        image: redis:7-alpine
        container_name: pharmapos-redis
        restart: unless-stopped
        ports:
            - '${REDIS_PORT:-6379}:6379'
        command: redis-server --appendonly yes --requirepass '${REDIS_PASSWORD:-secret}'
        volumes:
            - redis-data:/data
        healthcheck:
            test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD:-secret}', 'ping']
            interval: 10s
            timeout: 5s
            retries: 5
        networks:
            - pharmapos

    phpmyadmin:
        image: phpmyadmin:latest
        container_name: pharmapos-phpmyadmin
        restart: unless-stopped
        ports:
            - '${PMA_PORT:-8080}:80'
        environment:
            PMA_HOST: mysql
            PMA_PORT: 3306
            PMA_USER: '${DB_USERNAME}'
            PMA_PASSWORD: '${DB_PASSWORD}'
            UPLOAD_LIMIT: 64M
        depends_on:
            mysql:
                condition: service_healthy
        networks:
            - pharmapos

volumes:
    mysql-data:
        driver: local
    redis-data:
        driver: local

networks:
    pharmapos:
        driver: bridge
